<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Secure Connect Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
  input, button { padding: .5rem; margin: .2rem 0; }
  #log { border: 1px solid #ccc; height: 260px; overflow-y: auto; padding: .5rem; margin: .5rem 0; }
  .sys { color: #888; font-style: italic; }
  .hidden { display: none; }
</style>
</head>
<body>
<h2>Secure Connect Chat</h2>

<div id="auth">
  <input id="email" placeholder="email" /><br />
  <input id="password" type="password" placeholder="password" /><br />
  <button onclick="login()">Login</button>
  <span id="err" style="color:red"></span>
</div>

<div id="chat" class="hidden">
  <div>Room: <input id="room" value="general" size="10" /> <button onclick="join()">Join</button></div>
  <div id="log"></div>
  <input id="msg" placeholder="Type a message" size="35" onkeydown="if(event.key==='Enter')send()" />
  <button onclick="send()">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  let socket;
  const log = (html, cls = '') => {
    const d = document.createElement('div');
    d.className = cls; d.textContent = html;
    document.getElementById('log').appendChild(d);
    d.scrollIntoView();
  };

  async function login() {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value, password: password.value }),
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.message; return; }

    socket = io({ auth: { token: data.token } });
    socket.on('connect_error', (e) => { err.textContent = e.message; });
    socket.on('connect', () => {
      auth.classList.add('hidden'); chat.classList.remove('hidden');
    });
    socket.on('message', (m) => log(`[${m.room}] ${m.username}: ${m.text}`));
    socket.on('system', (t) => log(t, 'sys'));
  }
  function join() { socket.emit('joinRoom', room.value); }
  function send() {
    if (!msg.value.trim()) return;
    socket.emit('chatMessage', { room: room.value, text: msg.value });
    msg.value = '';
  }
</script>
</body>
</html>
